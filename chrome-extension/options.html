<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transcribe - Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e4e4e7;
      padding: 40px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 24px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #4a4a4f;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 8px;
      background: #2a2a2d;
      color: #e4e4e7;
    }
    input[type="password"]:focus,
    input[type="text"]:focus { outline: none; border-color: #3b82f6; }
    .field-group { margin-bottom: 20px; }
    .hint {
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 20px;
    }
    .hint a { color: #3b82f6; }
    button {
      padding: 10px 24px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #34d399;
      display: none;
    }
    .note {
      margin-top: 24px;
      font-size: 12px;
      color: #71717a;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Transcribe Settings</h1>
  <div class="field-group">
    <label for="apiKey">OpenAI API Key</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <div class="hint">Get your key at <a href="https://platform.openai.com/api-keys" target="_blank">platform.openai.com/api-keys</a></div>
  </div>
  <div class="field-group">
    <label for="backendUrl">Backend URL</label>
    <input type="text" id="backendUrl" placeholder="https://api.scribetok.com">
    <div class="hint">URL for TikTok/YouTube transcription backend. Default: https://api.scribetok.com</div>
  </div>
  <button id="saveBtn">Save</button>
  <div class="status" id="status">Saved!</div>
  <div class="note">Your key stays local and calls OpenAI directly. It is never sent to any other server.</div>
  <script src="options.js"></script>
</body>
</html>
