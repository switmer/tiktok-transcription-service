name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  TESTING: 'true'
  ENVIRONMENT: 'ci'
  TWILIO_SKIP_SIGNATURE_VALIDATION: 'true'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Syntax and undefined-name checks
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=app/local_scripts,app/.possible_implementations,app/sms_backup.py

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run offline unit tests
        env:
          TESTING: 'true'
          ENVIRONMENT: 'ci'
          TWILIO_SKIP_SIGNATURE_VALIDATION: 'true'
          OPENAI_API_KEY: test-key
          RAPIDAPI_KEY: test-key
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -c app/pytest.ini \
            app/tests/test_platform_detection.py \
            app/tests/test_video_finder.py \
            app/tests/test_twilio_signature.py \
            app/tests/test_sms_chat_threads.py \
            app/tests/test_large_audio_transcription.py \
            app/tests/test_language_detection.py \
            app/tests/test_comments_preview.py \
            app/tests/test_user_credits.py \
            -q --tb=short

  build:
    name: Import check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Import FastAPI app
        env:
          TESTING: 'true'
          ENVIRONMENT: 'ci'
        run: |
          python -c "
          from app import app

          def collect_paths(application):
              found = set()
              for route in application.routes:
                  path = getattr(route, 'path', None)
                  if path:
                      found.add(path)
                  original = getattr(route, 'original_router', None)
                  if original is not None:
                      for sub in original.routes:
                          sub_path = getattr(sub, 'path', None)
                          if sub_path:
                              found.add(sub_path)
              return found

          paths = collect_paths(app)
          assert '/api/sms/chat' in paths, paths
          assert '/api/public/transcribe' in paths, paths
          print('FastAPI app imports; /api/sms/chat is registered')
          "
