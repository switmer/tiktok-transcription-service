name: 🏷️ Release Management

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
        type: string
      release_type:
        description: 'Type of release'
        required: true
        default: 'minor'
        type: choice
        options:
        - patch
        - minor
        - major
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        default: false
        type: boolean

jobs:
  # ===================================
  # CREATE RELEASE
  # ===================================
  create-release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.tag.outputs.tag }}
      release-notes: ${{ steps.notes.outputs.notes }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for changelog

      - name: 🏷️ Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            tag="${{ github.event.inputs.version }}"
          else
            tag="${{ github.ref_name }}"
          fi
          
          # Ensure tag starts with 'v'
          if [[ ! "$tag" =~ ^v ]]; then
            tag="v$tag"
          fi
          
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "Release tag: $tag"

      - name: 📝 Generate release notes
        id: notes
        run: |
          echo "Generating release notes for ${{ steps.tag.outputs.tag }}..."
          
          # Get previous tag
          previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [[ -n "$previous_tag" ]]; then
            echo "Previous tag: $previous_tag"
            
            # Generate changelog
            cat > release_notes.md << EOF
          ## 🚀 What's New in ${{ steps.tag.outputs.tag }}
          
          ### 📊 Changes Since $previous_tag
          
          EOF
            
            # Add commit messages grouped by type
            git log --pretty=format:"- %s" $previous_tag..HEAD | while read line; do
              if [[ "$line" =~ ^-\ 🚀|^-\ ✨ ]]; then
                echo "#### ✨ Features" >> release_notes.md
                echo "$line" >> release_notes.md
              elif [[ "$line" =~ ^-\ 🐛|^-\ 🔧 ]]; then
                echo "#### 🐛 Bug Fixes" >> release_notes.md
                echo "$line" >> release_notes.md
              elif [[ "$line" =~ ^-\ 📚|^-\ 📝 ]]; then
                echo "#### 📚 Documentation" >> release_notes.md
                echo "$line" >> release_notes.md
              elif [[ "$line" =~ ^-\ 🧪|^-\ ✅ ]]; then
                echo "#### 🧪 Testing" >> release_notes.md
                echo "$line" >> release_notes.md
              else
                echo "#### 🔄 Other Changes" >> release_notes.md
                echo "$line" >> release_notes.md
              fi
            done
            
          else
            echo "## 🎉 Initial Release" > release_notes.md
            echo "" >> release_notes.md
            echo "This is the first release of the TikTok/YouTube Transcription Service!" >> release_notes.md
          fi
          
          # Add deployment info
          cat >> release_notes.md << EOF
          
          ## 🛠️ Technical Details
          
          - **Commit:** \`${{ github.sha }}\`
          - **Build:** [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Released by:** ${{ github.actor }}
          
          ## 🔗 Links
          
          - [Full Changelog](https://github.com/${{ github.repository }}/compare/$previous_tag...${{ steps.tag.outputs.tag }})
          - [Documentation](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.tag }}/TECHNICAL_ARCHITECTURE.md)
          
          EOF
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🏷️ Create Git tag
        if: github.event.inputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag.outputs.tag }}" -m "Release ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: 📦 Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: Release ${{ steps.tag.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}

  # ===================================
  # PRODUCTION DEPLOYMENT
  # ===================================
  deploy-production:
    name: 🚀 Deploy to Production
    needs: create-release
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      run_health_checks: true

  # ===================================
  # POST-RELEASE TASKS
  # ===================================
  post-release:
    name: 📋 Post-Release Tasks
    runs-on: ubuntu-latest
    needs: [create-release, deploy-production]
    if: success()
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Update deployment status
        run: |
          echo "::notice title=Release Complete::Successfully released ${{ needs.create-release.outputs.release-tag }} to production"

      - name: 📈 Create deployment metrics
        run: |
          cat > deployment-metrics.json << EOF
          {
            "release_tag": "${{ needs.create-release.outputs.release-tag }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit_sha": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "workflow_run": "${{ github.run_id }}",
            "environment": "production",
            "status": "success"
          }
          EOF
          
          echo "📊 Deployment metrics created"

      - name: 🔔 Success notification
        run: |
          echo "🎉 Release ${{ needs.create-release.outputs.release-tag }} deployed successfully!"
          echo "🔗 Production URL: ${{ secrets.PRODUCTION_URL }}"
          echo "📊 Monitor at: ${{ secrets.MONITORING_URL }}"

  # ===================================
  # ROLLBACK CAPABILITY
  # ===================================
  rollback:
    name: 🔄 Rollback Capability
    runs-on: ubuntu-latest
    if: failure()
    needs: [create-release, deploy-production]
    
    steps:
      - name: 🚨 Deployment failed
        run: |
          echo "::error title=Release Failed::Release ${{ needs.create-release.outputs.release-tag }} deployment failed"
          echo "🚨 Deployment failed - consider rollback"
          echo "To rollback:"
          echo "1. Check the deployment logs"
          echo "2. If needed, trigger rollback workflow"
          echo "3. Update release status to failed"

      - name: 📋 Rollback instructions
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚨 Release Deployment Failed
          
          **Release:** ${{ needs.create-release.outputs.release-tag }}
          **Status:** ❌ Failed
          **Commit:** \`${{ github.sha }}\`
          
          ## 🔄 Rollback Options
          
          1. **Manual Rollback:** Redeploy previous stable version
          2. **Hotfix:** Create hotfix branch and patch
          3. **Investigation:** Check logs and debug issues
          
          ## 📞 Contact
          
          - Check deployment logs above
          - Contact DevOps team if needed
          - Monitor system health
          
          EOF