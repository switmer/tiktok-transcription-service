[tool:pytest]
# Pytest configuration for TikTok/YouTube Transcription Service

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Markers for test categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for component interactions
    e2e: End-to-end tests for complete workflows
    slow: Tests that take more than 5 seconds
    database: Tests that require database connection
    external: Tests that call external APIs
    sms: Tests related to SMS functionality
    fts: Tests for full-text search functionality
    credits: Tests for credit system functionality

# Output and reporting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
    --durations=10

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# Environment variables for testing
env =
    TESTING = true
    LOG_LEVEL = INFO
    ENVIRONMENT = test

# Timeout for hanging tests
timeout = 300

# Minimum Python version
minversion = 3.8