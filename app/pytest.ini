[tool:pytest]
# Pytest configuration for TikTok/YouTube Transcription Service

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers for test categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for component interactions
    e2e: End-to-end tests for complete workflows
    slow: Tests that take more than 5 seconds
    database: Tests that require database connection
    external: Tests that call external APIs
    sms: Tests related to SMS functionality
    fts: Tests for full-text search functionality
    credits: Tests for credit system functionality

# Keep default addopts free of coverage/plugin-only keys so CI can parse
# this file without pytest-env / pytest-timeout.
addopts =
    --verbose
    --tb=short
    --strict-markers

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# Minimum Python version
minversion = 3.8
