<!-- ========================================== -->
<!-- COMMENTS SECTION - Add to transcript.html -->
<!-- ========================================== -->

<!-- Add this section after the transcript content -->
<div class="mt-8 border-t border-border pt-8">
    <!-- Comments Header -->
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold flex items-center gap-2">
            <span>💬</span>
            <span>Comments</span>
            <span id="comment-count" class="text-muted-foreground text-lg ml-2"></span>
        </h2>
        
        <!-- Sort Dropdown (shown only after comments loaded) -->
        <div id="sort-controls" class="hidden">
            <select id="sort-select" class="bg-card border border-border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                <option value="likes">Most Liked</option>
                <option value="recent">Most Recent</option>
                <option value="replies">Most Replies</option>
            </select>
        </div>
    </div>
    
    <!-- Comments Container -->
    <div id="comments-container">
        <!-- STATE A: Not Fetched (Initial) -->
        <div id="comments-empty-state" class="bg-card border border-border rounded-xl p-8 text-center">
            <div class="max-w-md mx-auto">
                <div class="text-4xl mb-4">💬</div>
                <h3 class="text-xl font-semibold mb-2">Want to see what people are saying?</h3>
                <p class="text-muted-foreground mb-6">
                    View top comments from this TikTok video
                </p>
                
                <!-- Fetch Button -->
                <button 
                    id="fetch-comments-btn"
                    onclick="fetchComments()"
                    class="bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold px-8 py-3 rounded-lg transition-all transform hover:scale-105 flex items-center gap-2 mx-auto shadow-lg"
                >
                    <span>💬</span>
                    <span>View Comments</span>
                    <span class="bg-white/20 px-2 py-1 rounded text-sm">1 Credit</span>
                </button>
                
                <!-- Credit Info -->
                <p id="credit-info" class="text-sm text-muted-foreground mt-4">
                    <span class="inline-block px-3 py-1 bg-secondary rounded-full">
                        💡 Credits left: <span id="credits-remaining">?</span>
                    </span>
                </p>
                
                <!-- No Credits Warning (hidden initially) -->
                <div id="no-credits-warning" class="hidden mt-4 p-4 bg-yellow-500/10 border border-yellow-500/30 rounded-lg">
                    <p class="text-sm text-yellow-600 dark:text-yellow-400">
                        ⚠️ You need credits to view comments. Text <strong>CREDITS</strong> to get started.
                    </p>
                </div>
            </div>
        </div>
        
        <!-- STATE B: Loading -->
        <div id="comments-loading-state" class="hidden bg-card border border-border rounded-xl p-8 text-center">
            <div class="flex flex-col items-center justify-center gap-4">
                <div class="flex space-x-2">
                    <div class="w-3 h-3 bg-primary rounded-full animate-bounce"></div>
                    <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                    <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                </div>
                <div>
                    <p class="font-semibold">Fetching comments from TikTok...</p>
                    <p class="text-sm text-muted-foreground mt-1">This usually takes about 5 seconds</p>
                </div>
            </div>
        </div>
        
        <!-- STATE C: Comments Loaded -->
        <div id="comments-list" class="hidden space-y-4">
            <!-- Comments will be inserted here dynamically -->
        </div>
        
        <!-- Load More Button -->
        <div id="load-more-container" class="hidden mt-6 text-center">
            <button 
                onclick="loadMoreComments()"
                class="bg-secondary hover:bg-secondary/80 px-6 py-3 rounded-lg font-medium transition-all"
            >
                <span id="load-more-text">Load More Comments</span>
                <span id="remaining-count" class="text-muted-foreground ml-2"></span>
            </button>
        </div>
        
        <!-- Error State -->
        <div id="comments-error-state" class="hidden bg-card border border-destructive/30 rounded-xl p-8 text-center">
            <div class="text-4xl mb-4">😕</div>
            <h3 class="text-xl font-semibold mb-2">Failed to fetch comments</h3>
            <p id="error-message" class="text-muted-foreground mb-4"></p>
            <button 
                onclick="retryFetchComments()"
                class="bg-primary hover:bg-primary/90 text-primary-foreground px-6 py-2 rounded-lg font-medium transition-all"
            >
                Try Again
            </button>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- JAVASCRIPT FOR COMMENTS -->
<!-- ========================================== -->
<script>
const API_BASE_URL = 'https://share.scribetok.com';
const API_KEY = 'f8a9b1e2-c5d4-4e5f-8d7b-1c2d3e4f5a6b'; // Replace with actual API key
const TASK_ID = '{{ task_id }}'; // Injected from backend

let currentOffset = 0;
let totalComments = 0;
let hasMore = false;

// On page load, check if comments already exist
window.addEventListener('DOMContentLoaded', async () => {
    await checkExistingComments();
    // await checkUserCredits(); // Optional: Show remaining credits
});

async function checkExistingComments() {
    try {
        const response = await fetch(
            `${API_BASE_URL}/api/public/comments/${TASK_ID}?limit=10`,
            { headers: { 'X-API-Key': API_KEY } }
        );
        
        if (response.ok) {
            const data = await response.json();
            if (data.comments && data.comments.length > 0) {
                // Comments already fetched - show them
                showCommentsState();
                displayComments(data.comments);
                totalComments = data.count;
                updateCommentCount(totalComments);
                
                // Check if there are more
                if (data.count > 10) {
                    document.getElementById('load-more-container').classList.remove('hidden');
                    updateRemainingCount(data.count - 10);
                }
            }
        }
    } catch (error) {
        console.error('Error checking existing comments:', error);
    }
}

async function fetchComments() {
    const btn = document.getElementById('fetch-comments-btn');
    const originalText = btn.innerHTML;
    
    try {
        // Show loading state
        showLoadingState();
        
        // Make API call
        const response = await fetch(
            `${API_BASE_URL}/api/pro/comments/fetch`,
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-API-Key': API_KEY
                },
                body: JSON.stringify({
                    task_id: TASK_ID,
                    count: 30
                })
            }
        );
        
        const data = await response.json();
        
        if (response.ok) {
            // Success! Show comments
            totalComments = data.comments_fetched;
            hasMore = data.has_more;
            
            // Small delay for better UX
            setTimeout(async () => {
                await loadComments();
                
                // Show success toast
                showToast(`✓ Loaded ${totalComments} comments`, 'success');
                
                // Scroll to comments
                document.getElementById('comments-container').scrollIntoView({ 
                    behavior: 'smooth',
                    block: 'start'
                });
            }, 500);
        } else {
            // Error handling
            if (response.status === 402) {
                showNoCreditsWarning();
            } else {
                showErrorState(data.detail || 'Failed to fetch comments');
            }
        }
    } catch (error) {
        console.error('Error fetching comments:', error);
        showErrorState('Network error. Please check your connection.');
    }
}

async function loadComments(offset = 0, sortBy = 'likes') {
    try {
        const response = await fetch(
            `${API_BASE_URL}/api/public/comments/${TASK_ID}?limit=10&offset=${offset}&sort_by=${sortBy}`,
            { headers: { 'X-API-Key': API_KEY } }
        );
        
        if (response.ok) {
            const data = await response.json();
            showCommentsState();
            
            if (offset === 0) {
                // First load - replace
                displayComments(data.comments);
            } else {
                // Load more - append
                appendComments(data.comments);
            }
            
            // Update pagination
            currentOffset = offset + data.comments.length;
            const remaining = totalComments - currentOffset;
            
            if (remaining > 0) {
                document.getElementById('load-more-container').classList.remove('hidden');
                updateRemainingCount(remaining);
            } else {
                document.getElementById('load-more-container').classList.add('hidden');
            }
        }
    } catch (error) {
        console.error('Error loading comments:', error);
    }
}

function displayComments(comments) {
    const container = document.getElementById('comments-list');
    container.innerHTML = comments.map(comment => createCommentHTML(comment)).join('');
    updateCommentCount(totalComments);
}

function appendComments(comments) {
    const container = document.getElementById('comments-list');
    container.innerHTML += comments.map(comment => createCommentHTML(comment)).join('');
}

function createCommentHTML(comment) {
    const timeAgo = formatTimeAgo(comment.created_at_timestamp);
    const avatar = comment.author_avatar || 'https://via.placeholder.com/40';
    
    return `
        <div class="bg-card border border-border rounded-xl p-4 hover:border-primary transition-all comment-card">
            <div class="flex items-start gap-3">
                <!-- Avatar -->
                <img src="${avatar}" 
                     alt="${comment.author_name}" 
                     class="w-10 h-10 rounded-full object-cover"
                     onerror="this.src='https://via.placeholder.com/40'">
                
                <!-- Content -->
                <div class="flex-1 min-w-0">
                    <!-- Author -->
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <span class="font-semibold">${comment.author_name}</span>
                            <span class="text-muted-foreground text-sm ml-2">@${comment.author_username}</span>
                        </div>
                        <div class="flex items-center gap-1 text-muted-foreground">
                            <span class="text-red-500">❤️</span>
                            <span class="text-sm font-medium">${formatNumber(comment.likes)}</span>
                        </div>
                    </div>
                    
                    <!-- Comment Text -->
                    <p class="text-foreground mb-2 leading-relaxed">${comment.text}</p>
                    
                    <!-- Meta -->
                    <div class="flex items-center gap-4 text-xs text-muted-foreground">
                        ${comment.reply_count > 0 ? `<span>💭 ${comment.reply_count} replies</span>` : ''}
                        <span>${timeAgo}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function loadMoreComments() {
    const btn = document.getElementById('load-more-text');
    btn.textContent = 'Loading...';
    
    loadComments(currentOffset).then(() => {
        btn.textContent = 'Load More Comments';
    });
}

function retryFetchComments() {
    document.getElementById('comments-error-state').classList.add('hidden');
    document.getElementById('comments-empty-state').classList.remove('hidden');
}

// State management functions
function showLoadingState() {
    document.getElementById('comments-empty-state').classList.add('hidden');
    document.getElementById('comments-error-state').classList.add('hidden');
    document.getElementById('comments-list').classList.add('hidden');
    document.getElementById('comments-loading-state').classList.remove('hidden');
}

function showCommentsState() {
    document.getElementById('comments-empty-state').classList.add('hidden');
    document.getElementById('comments-error-state').classList.add('hidden');
    document.getElementById('comments-loading-state').classList.add('hidden');
    document.getElementById('comments-list').classList.remove('hidden');
    document.getElementById('sort-controls').classList.remove('hidden');
}

function showErrorState(message) {
    document.getElementById('comments-empty-state').classList.add('hidden');
    document.getElementById('comments-loading-state').classList.add('hidden');
    document.getElementById('comments-list').classList.add('hidden');
    document.getElementById('comments-error-state').classList.remove('hidden');
    document.getElementById('error-message').textContent = message;
}

function showNoCreditsWarning() {
    document.getElementById('comments-loading-state').classList.add('hidden');
    document.getElementById('comments-empty-state').classList.remove('hidden');
    document.getElementById('no-credits-warning').classList.remove('hidden');
}

// Utility functions
function updateCommentCount(count) {
    document.getElementById('comment-count').textContent = `(${count})`;
}

function updateRemainingCount(count) {
    document.getElementById('remaining-count').textContent = `(${count} more)`;
}

function formatNumber(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num.toString();
}

function formatTimeAgo(timestamp) {
    if (!timestamp) return '';
    
    const seconds = Math.floor(Date.now() / 1000 - parseInt(timestamp));
    
    if (seconds < 60) return 'just now';
    if (seconds < 3600) return Math.floor(seconds / 60) + ' minutes ago';
    if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
    if (seconds < 604800) return Math.floor(seconds / 86400) + ' days ago';
    
    return new Date(parseInt(timestamp) * 1000).toLocaleDateString();
}

function showToast(message, type = 'success') {
    // Simple toast notification
    const toast = document.createElement('div');
    toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg z-50 ${
        type === 'success' ? 'bg-green-500' : 'bg-red-500'
    } text-white font-medium`;
    toast.textContent = message;
    
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.classList.add('opacity-0', 'transition-opacity');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// Sort handler
document.getElementById('sort-select')?.addEventListener('change', (e) => {
    currentOffset = 0;
    loadComments(0, e.target.value);
});
</script>

<style>
/* Additional animations */
.comment-card {
    animation: fadeIn 0.3s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Stagger animation for multiple comments */
.comment-card:nth-child(1) { animation-delay: 0.05s; }
.comment-card:nth-child(2) { animation-delay: 0.1s; }
.comment-card:nth-child(3) { animation-delay: 0.15s; }
</style>
